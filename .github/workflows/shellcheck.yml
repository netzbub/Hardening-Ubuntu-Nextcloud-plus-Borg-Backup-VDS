name: ShellCheck

# Runs on GitHub's servers (not locally) on every push / pull request that
# touches a shell script, and can also be started by hand (workflow_dispatch).
on:
  push:
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**.sh"
  workflow_dispatch:

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # ShellCheck comes straight from the Ubuntu repos - no opaque third-party
      # action, in keeping with the project's "no blind curl | bash" stance.
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Severity "warning" since 2026-10-01: install.sh is clean at this level
      # (verified with shellcheck 0.9.0). Only SC2015/SC1091 remain on "info".
      - name: Run ShellCheck
        run: shellcheck --severity=warning --shell=bash install.sh
